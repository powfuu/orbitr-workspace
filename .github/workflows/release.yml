# Builds signed installers for macOS (Apple Silicon + Intel) and Windows when a
# version tag is pushed, and publishes them with the updater manifest (latest.json)
# to a draft GitHub Release. Publish the draft to roll the update out.
#
# Required secret:  TAURI_SIGNING_PRIVATE_KEY  (contents of ~/.tauri/orbitr-updater.key)
# Optional secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#                   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  (macOS signing + notarization)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # Without the updater signing key, still build installers (just without auto-update files).
      - name: Updater config
        id: cfg
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > no-updater.json
            echo "extra=--config no-updater.json" >> "$GITHUB_OUTPUT"
            echo "updater=false" >> "$GITHUB_OUTPUT"
          else
            echo "updater=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Orbitr v__VERSION__
          releaseBody: |
            **Windows:** download the `.exe` (or `.msi`) and run it. If SmartScreen warns, click "More info" → "Run anyway".
            **macOS:** download the `.dmg` for your Mac (aarch64 = Apple Silicon, x64 = Intel) and drag Orbitr to Applications. First launch: right-click → Open.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.cfg.outputs.updater }}
          args: --target ${{ matrix.target }} ${{ steps.cfg.outputs.extra }}

  checks:
    # Same gates as local development, on every tag.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test
        working-directory: src-tauri
